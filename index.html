<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Superhemlig present</title>
<style>
  :root {
    color-scheme: dark;
    --night: #0e1a30;
    --night-2: #1b3050;
    --frost: #eaf3ff;
    --frost-dim: #a9bddb;
    --gold: #f4c451;
    --gold-deep: #c8912a;
    --red: #e0443e;
    --blue: #3b82f6;
    --ok: #7fe0a0;
    --bad: #ff8f8a;
    --serif: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0;
    height: 100%;
    background: radial-gradient(ellipse at 50% 0%, var(--night-2) 0%, var(--night) 70%);
    color: var(--frost);
    font-family: var(--sans);
    overflow: hidden;
  }
  #snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
  #stage { position: fixed; inset: 0; z-index: 2; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .slide {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 1.2rem;
    padding: 4.5rem max(1.25rem, env(safe-area-inset-right, 0px)) 1.5rem max(1.25rem, env(safe-area-inset-left, 0px));
    text-align: center;
    overflow-y: auto;
  }
  .slide.active { display: flex; animation: fadein .6s ease both; }
  @keyframes fadein { from { opacity: 0; transform: scale(.98); } to { opacity: 1; transform: none; } }

  h1, h2, p { margin: 0; }
  .title {
    font-family: var(--serif);
    font-size: clamp(2.2rem, 9vw, 4.4rem);
    line-height: 1.05;
    font-weight: 700;
    letter-spacing: .01em;
    max-width: 14ch;
  }
  .lead {
    font-family: var(--serif);
    font-size: clamp(1.1rem, 3.6vw, 1.45rem);
    line-height: 1.5;
    color: var(--frost-dim);
    max-width: 34ch;
  }
  .question {
    font-family: var(--serif);
    font-size: clamp(1.7rem, 6vw, 2.8rem);
    line-height: 1.2;
    font-weight: 700;
    max-width: 20ch;
  }
  .cat { width: clamp(120px, 28vw, 190px); height: auto; flex: none; }
  .cat.big { width: clamp(180px, 50vw, 320px); }

  button { font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .btn {
    border: 0; border-radius: 999px;
    padding: .8rem 1.6rem;
    font-weight: 700; font-size: 1.05rem;
    color: #1a1305;
    background: var(--gold);
    box-shadow: 0 4px 0 var(--gold-deep);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--gold-deep); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-deep); }
  .btn.ghost { background: transparent; color: var(--frost); box-shadow: inset 0 0 0 2px var(--frost-dim); }
  .btn.ghost:hover { box-shadow: inset 0 0 0 2px var(--gold); }

  .start-btn {
    font-family: var(--serif);
    font-size: clamp(1.6rem, 6vw, 2.4rem);
    padding: 1.1rem 3rem;
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }

  .answer-row { display: flex; gap: .6rem; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 30rem; }
  input[type=text] {
    flex: 1 1 12rem;
    min-width: 0;
    font: inherit; font-size: 1.2rem;
    padding: .75rem 1rem;
    border-radius: 14px;
    border: 2px solid var(--frost-dim);
    background: rgba(255,255,255,.08);
    color: var(--frost);
    text-align: center;
  }
  input[type=text]::placeholder { color: var(--frost-dim); opacity: .7; }
  .feedback { min-height: 1.5rem; font-weight: 600; }
  .feedback.ok { color: var(--ok); }
  .feedback.bad { color: var(--bad); }
  .feedback.warm { color: var(--gold); }
  .shake { animation: shake .45s ease; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }

  .hints { display: flex; flex-wrap: wrap; gap: .4rem; justify-content: center; max-width: 30rem; min-height: 2rem; }
  .chip { background: rgba(244,196,81,.16); border: 1px solid var(--gold); color: var(--gold); border-radius: 999px; padding: .2rem .8rem; font-weight: 600; animation: pop .3s ease both; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }

  .rb-row { display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center; }
  .rb { width: clamp(110px, 32vw, 160px); height: clamp(110px, 32vw, 160px); border-radius: 50%; border: 0; box-shadow: 0 8px 0 rgba(0,0,0,.35), inset 0 -8px 0 rgba(0,0,0,.18); transition: transform .12s ease; }
  .rb:hover { transform: translateY(-3px); }
  .rb:active { transform: translateY(5px); }
  .rb.red { background: var(--red); }
  .rb.blue { background: var(--blue); }

  .crowd { display: flex; align-items: flex-end; justify-content: center; gap: clamp(.2rem, 2vw, 1rem); flex-wrap: nowrap; width: 100%; max-width: 40rem; }
  .person { background: none; border: 0; padding: 0; flex: 1 1 0; max-width: 110px; min-width: 0; }
  .person svg { width: 100%; height: auto; display: block; overflow: visible; }
  .person .jumper { transform-box: fill-box; transform-origin: 50% 100%; animation: jump .7s ease-in-out infinite; }
  .person:nth-child(2) .jumper { animation-delay: -.15s; }
  .person:nth-child(3) .jumper { animation-delay: -.3s; }
  .person:nth-child(4) .jumper { animation-delay: -.45s; }
  .person:nth-child(5) .jumper { animation-delay: -.6s; }
  @keyframes jump { 0%,100% { transform: translateY(0) scaleY(.94); } 50% { transform: translateY(-34px) scaleY(1.02); } }
  .person .arm-l { transform-box: fill-box; transform-origin: 100% 100%; animation: armL .35s ease-in-out infinite alternate; }
  .person .arm-r { transform-box: fill-box; transform-origin: 0% 100%; animation: armR .35s ease-in-out infinite alternate; }
  @keyframes armL { from { transform: rotate(-16deg); } to { transform: rotate(14deg); } }
  @keyframes armR { from { transform: rotate(16deg); } to { transform: rotate(-14deg); } }
  .person:hover .jumper { animation-duration: .4s; }

  /* Cat animation */
  .cat .tail { transform-box: fill-box; transform-origin: 0% 100%; animation: swish 2.4s ease-in-out infinite; }
  @keyframes swish { 0%,100% { transform: rotate(-14deg); } 50% { transform: rotate(16deg); } }
  .cat .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
  .cat .head { transform-box: fill-box; transform-origin: 50% 100%; animation: tilt 5s ease-in-out infinite; }
  @keyframes tilt { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  .cat .ear { transform-box: fill-box; transform-origin: 50% 100%; animation: twitch 6s infinite; }
  @keyframes twitch { 0%,90%,100% { transform: rotate(0); } 93% { transform: rotate(-9deg); } 96% { transform: rotate(5deg); } }
  .cat .tongue { transform-box: fill-box; transform-origin: 50% 0%; animation: bleh .8s ease-in-out infinite alternate; }
  @keyframes bleh { from { transform: scaleY(.8); } to { transform: scaleY(1.15); } }

  /* Funny cat popup */
  #popup {
    position: fixed; inset: 0; z-index: 20;
    display: none; align-items: center; justify-content: center; flex-direction: column; gap: 1rem;
    background: rgba(8,14,28,.82);
    padding: 1.5rem; text-align: center;
  }
  #popup.show { display: flex; }
  #popup .cat { animation: wobble .6s ease-in-out infinite alternate; }
  @keyframes wobble { from { transform: rotate(-6deg) scale(1); } to { transform: rotate(6deg) scale(1.06); } }
  #popup p { font-family: var(--serif); font-size: clamp(1.4rem, 5vw, 2.2rem); font-weight: 700; max-width: 18ch; }

  .numbers { display: flex; flex-wrap: nowrap; justify-content: center; gap: clamp(.35rem, 2vw, 1rem); width: 100%; max-width: 42rem; }
  .num { flex: 1 1 0; min-width: 0; padding: .7rem .2rem; border-radius: 12px; border: 2px solid var(--frost-dim); background: rgba(255,255,255,.07); font-family: var(--serif); font-weight: 700; font-size: clamp(1.05rem, 5.2vw, 2.4rem); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  .num .gap { color: var(--gold); border-bottom: 3px dashed var(--gold); }

  /* Mobile & desktop */
  html { -webkit-text-size-adjust: 100%; }
  button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .slide { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  /* centers content when it fits, lets it scroll from the top when it does not */
  .slide::before, .slide::after { content: ""; flex: 1 0 0; }
  @media (hover: none) {
    .btn:hover { transform: none; box-shadow: 0 4px 0 var(--gold-deep); }
    .btn.ghost:hover { box-shadow: inset 0 0 0 2px var(--frost-dim); }
    .rb:hover { transform: none; }
    .person:hover .jumper { animation-duration: .7s; }
    body #runway #runner:hover { animation-play-state: running; }
  }
  @media (min-width: 900px) {
    .slide { gap: 1.6rem; }
    .cat { width: clamp(150px, 16vw, 230px); }
  }
  @media (max-height: 560px) {
    .slide { gap: .6rem; padding-top: 3.8rem; padding-bottom: .8rem; }
    .cat { width: clamp(80px, 22vh, 130px); }
    .cat.big { width: clamp(110px, 34vh, 190px); }
    .title { font-size: 2rem; }
    .question { font-size: 1.4rem; }
    .lead { font-size: 1rem; }
    .start-btn { padding: .7rem 2rem; }
    .rb { width: 90px; height: 90px; }
    .person { max-width: 80px; }
    .num { padding: .4rem .2rem; }
    body #runway { height: 48px; }
    body #runway #runner { width: 70px; height: 42px; top: 3px; }
  }

  /* Lightning transition */
  #dark { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 30%, #1a1650 0%, #03030f 80%); opacity: 0; z-index: 38; pointer-events: none; transition: opacity .5s ease; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 40; pointer-events: none; }
  #fx.on { pointer-events: auto; }
  #flash { position: fixed; inset: 0; background: #f2f5ff; opacity: 0; z-index: 45; pointer-events: none; }
  #stage.quake { animation: quake .14s linear infinite; }
  @keyframes quake { 0%, 100% { transform: translate(0, 0); } 20% { transform: translate(-7px, 4px); } 40% { transform: translate(6px, -5px); } 60% { transform: translate(-5px, -3px); } 80% { transform: translate(7px, 5px); } }

  /* Reveal slide: Bio Aspen x Dune, cartoon style */
  .reveal-slide { gap: 1rem; --display: "Cooper Black", "Rockwell Extra Bold", "Rockwell", "Arial Rounded MT Bold", Georgia, serif; }
  .scene { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
  .scene svg { width: 100%; height: 100%; display: block; }
  .scene .twinkle { animation: twinkle2 2.4s ease-in-out infinite alternate; }
  @keyframes twinkle2 { from { opacity: .25; } to { opacity: 1; } }
  .scene .worm { transform-origin: 400px 660px; animation: wormsway 6s ease-in-out infinite alternate; }
  @keyframes wormsway { from { transform: rotate(-3deg); } to { transform: rotate(4deg); } }
  .scene .orni-fly { animation: fly 16s ease-in-out infinite alternate; }
  @keyframes fly { from { transform: translate(-260px, 20px); } to { transform: translate(240px, -30px); } }
  .scene .wing { animation: flap .16s ease-in-out infinite alternate; }
  .scene .wing.a { transform-origin: -8px -8px; }
  .scene .wing.b { transform-origin: 12px -8px; animation-delay: -.08s; }
  @keyframes flap { from { transform: rotate(-28deg); } to { transform: rotate(28deg); } }
  .scene .bolt { opacity: 0; animation: boltflash 5s infinite; }
  .scene .bolt.b2 { animation-duration: 7.3s; animation-delay: -2s; }
  @keyframes boltflash { 0%, 88%, 100% { opacity: 0; } 89% { opacity: 1; } 91% { opacity: .15; } 93% { opacity: 1; } 96% { opacity: 0; } }
  .scene .skyflash { opacity: 0; animation: skyflash 5s infinite; }
  @keyframes skyflash { 0%, 88%, 100% { opacity: 0; } 89% { opacity: .35; } 91% { opacity: 0; } 93% { opacity: .5; } 96% { opacity: 0; } }

  .curtain { position: fixed; top: 0; bottom: 0; width: 51%; z-index: 3; pointer-events: none; border-top: 16px solid #c8912a; background: repeating-linear-gradient(90deg, #8e1b22 0 18px, #b3262d 18px 36px, #7a141b 36px 48px); }
  .curtain.l { left: 0; box-shadow: inset -14px 0 30px rgba(0,0,0,.45); animation: curtl 1.7s cubic-bezier(.6, 0, .2, 1) .5s both; }
  .curtain.r { right: 0; box-shadow: inset 14px 0 30px rgba(0,0,0,.45); animation: curtr 1.7s cubic-bezier(.6, 0, .2, 1) .5s both; }
  @keyframes curtl { to { transform: translateX(-102%); } }
  @keyframes curtr { to { transform: translateX(102%); } }

  .rv { animation: rvin .8s cubic-bezier(.3, 1.4, .5, 1) both; animation-delay: var(--d, 1.8s); }
  @keyframes rvin { from { opacity: 0; transform: translateY(-30px) scale(.9); } to { opacity: 1; transform: none; } }

  .marquee { position: relative; background: #b3262d; color: #fff1c9; border: 5px solid #ffd86b; border-radius: 16px; padding: .6rem 1.8rem .5rem; margin-top: .6rem; box-shadow: 0 6px 0 #6e1319, 0 0 28px rgba(255,216,107,.45); font-family: var(--display); text-align: center; display: flex; flex-direction: column; align-items: center; line-height: 1.05; }
  .marquee .bulbs { position: absolute; inset: -13px; border: 7px dotted #ffe27a; border-radius: 26px; pointer-events: none; animation: bulbs 1.2s steps(1) infinite; }
  @keyframes bulbs { 0% { opacity: 1; } 50% { opacity: .4; } }
  .marquee .m-title { font-size: clamp(1.9rem, 8.5vw, 3.4rem); font-weight: 900; letter-spacing: .06em; text-shadow: 3px 3px 0 #6e1319; }
  .marquee .m-sub { font-size: clamp(.95rem, 3.5vw, 1.3rem); font-style: italic; color: #ffd86b; }

  .gift-title { font-family: var(--display); font-weight: 900; font-size: clamp(1.8rem, 7.4vw, 3.2rem); line-height: 1.08; color: #ffe9b0; text-shadow: 0 3px 0 #2a1630, 0 0 22px rgba(0,0,0,.55); max-width: 16ch; }
  .gift-lead { background: rgba(27,23,64,.62); padding: .4rem .9rem; border-radius: 12px; font-family: var(--serif); font-size: clamp(1.05rem, 3.6vw, 1.35rem); line-height: 1.4; color: #fff1d6; text-shadow: 0 2px 0 #2a1630, 0 0 14px rgba(0,0,0,.6); max-width: 30ch; }

  .tickets { display: flex; flex-direction: column; align-items: center; gap: 1rem; width: 100%; }
  .ticket { display: flex; width: min(92vw, 400px); background: #f6e7c1; color: #2a1630; border: 4px solid #2a1630; border-radius: 14px; box-shadow: 0 6px 0 rgba(0,0,0,.35); transform: rotate(var(--r)); animation: tdrop .9s cubic-bezier(.3, 1.5, .5, 1) both; animation-delay: var(--d); text-align: left; overflow: hidden; }
  @keyframes tdrop { from { opacity: 0; transform: translateY(-140px) rotate(calc(var(--r) - 14deg)); } to { opacity: 1; transform: rotate(var(--r)); } }
  .tk-main { flex: 1; min-width: 0; padding: .65rem .8rem; display: flex; flex-direction: column; gap: .12rem; }
  .tk-tag { font-weight: 800; font-size: .72rem; letter-spacing: .12em; color: #b3262d; }
  .tk-film { font-family: var(--display); font-weight: 900; font-size: 1.3rem; line-height: 1.1; }
  .tk-when { font-weight: 700; font-size: .95rem; }
  .tk-where { font-size: .78rem; opacity: .85; }
  .tk-stub { width: 74px; flex: none; border-left: 3px dashed #2a1630; background: #e9a64a; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .1rem; }
  .tk-lbl { font-weight: 800; font-size: .62rem; letter-spacing: .1em; }
  .tk-num { font-family: var(--display); font-weight: 900; font-size: 2.2rem; line-height: 1; }

  .about { background: rgba(27,23,64,.8); border: 3px solid #2a1630; border-radius: 16px; padding: .8rem 1.2rem; max-width: min(92vw, 30rem); display: flex; flex-direction: column; gap: .45rem; }
  .about h2 { font-family: var(--display); font-weight: 900; font-size: 1.3rem; color: #ffd86b; }
  .about p { margin: 0; color: #fff1d6; font-family: var(--serif); font-size: 1.05rem; line-height: 1.4; }
  .about .addr { font-size: .9rem; color: #c9b88f; }

  .notes { background: rgba(27,23,64,.8); border: 3px solid #2a1630; border-radius: 16px; padding: .7rem 1.2rem; display: flex; flex-direction: column; gap: .6rem; align-items: center; max-width: min(92vw, 30rem); }
  .notes p { margin: 0; color: #fff1d6; font-family: var(--serif); font-size: 1.1rem; }
  .osa { display: inline-block; border: 3px solid #ffd86b; border-radius: 10px; color: #ffd86b; padding: .2rem 1rem; font-family: var(--display); font-weight: 900; letter-spacing: .1em; font-size: 1.3rem; transform: rotate(-4deg); animation: stampin .5s cubic-bezier(.3, 1.6, .5, 1) 4.8s both; }
  button.osa { background: rgba(255,216,107,.12); cursor: pointer; animation: stampin .5s cubic-bezier(.3, 1.6, .5, 1) 4.8s both, osaglow 2s ease-in-out 5.6s infinite; }
  button.osa:hover { background: rgba(255,216,107,.25); }
  @keyframes osaglow { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,216,107,0); } 50% { box-shadow: 0 0 18px 2px rgba(255,216,107,.7); } }

  /* OSA popup */
  #osa-popup { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; background: rgba(8,14,28,.82); padding: 1.5rem; }
  #osa-popup.show { display: flex; }
  .osa-card { background: #f6e7c1; color: #2a1630; border: 4px solid #2a1630; border-radius: 18px; box-shadow: 0 8px 0 rgba(0,0,0,.4); padding: 1.4rem 1.4rem 1.2rem; max-width: min(92vw, 24rem); text-align: center; display: flex; flex-direction: column; gap: .8rem; align-items: center; animation: pop .35s cubic-bezier(.3, 1.6, .5, 1) both; }
  .osa-card h2 { font-family: "Cooper Black", "Rockwell Extra Bold", "Rockwell", "Arial Rounded MT Bold", Georgia, serif; font-weight: 900; font-size: 1.9rem; color: #b3262d; }
  .osa-card p { font-family: var(--serif); font-size: 1.1rem; }
  .osa-num { font-family: "Cooper Black", "Rockwell Extra Bold", "Rockwell", Georgia, serif; font-weight: 900; font-size: clamp(1.9rem, 9vw, 2.6rem); color: #b3262d; text-decoration: none; letter-spacing: .04em; border-bottom: 3px dashed #b3262d; user-select: all; -webkit-user-select: all; }
  .osa-actions { display: flex; gap: .6rem; flex-wrap: wrap; justify-content: center; }
  .osa-actions a.btn { text-decoration: none; display: inline-block; }
  .btn.dark { background: #2a1630; color: #f6e7c1; box-shadow: 0 4px 0 #000; }
  #osa-fb { min-height: 1.4rem; font-weight: 700; color: #1c7a47; }

  @keyframes stampin { from { opacity: 0; transform: scale(2.4) rotate(-14deg); } to { opacity: 1; transform: rotate(-4deg); } }

  @media (min-width: 900px) {
    .tickets { flex-direction: row; justify-content: center; gap: 1.6rem; }
  }
  @media (max-height: 560px) {
    .marquee .m-title { font-size: 1.6rem; }
    .gift-title { font-size: 1.5rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .reveal-slide .curtain { display: none; }
    .reveal-slide *, .reveal-slide .rv, .reveal-slide .ticket, .reveal-slide .osa { animation: none !important; }
    .scene .bolt, .scene .skyflash { display: none; }
    #stage.quake { animation: none; }
  }

  .wrong-counter { font-weight: 700; color: var(--bad); background: rgba(224,68,62,.14); border: 2px solid var(--bad); border-radius: 999px; padding: .2rem 1rem; }
  .wrong-counter b { font-size: 1.15em; }
  .wrong-counter.bump { animation: bump .45s ease; }

  /* Colour-cat game */
  .game-round { font-weight: 700; color: var(--gold); }
  .game-row { display: flex; gap: clamp(.25rem, 1.6vw, .9rem); justify-content: center; width: 100%; max-width: 44rem; }
  .gcat { flex: 1 1 0; min-width: 0; background: rgba(255,255,255,.06); border: 2px solid transparent; border-radius: 14px; padding: .35rem .15rem .5rem; display: flex; flex-direction: column; align-items: center; gap: .3rem; color: inherit; animation: pop .3s ease both; }
  .gcat .cat { width: 100%; }
  .gcat:active { transform: translateY(2px); }
  .gword { font-family: var(--serif); font-weight: 900; font-size: clamp(.68rem, 3.3vw, 1.3rem); text-shadow: 0 0 2px #000, 0 2px 0 rgba(0,0,0,.7); }
  @media (hover: hover) { .gcat:hover { border-color: var(--gold); } }

  /* Special wrong answer: laughing emoji and a text that flies away */
  .laugh-layer { position: fixed; inset: 0; z-index: 30; pointer-events: none; overflow: hidden; }
  .laugh-emoji { position: absolute; left: 50%; top: 38%; font-size: clamp(4.5rem, 20vw, 8rem); line-height: 1; transform: translate(-50%, -50%); animation: laughpop 2.4s ease both; }
  @keyframes laughpop {
    0% { transform: translate(-50%, -50%) scale(.2) rotate(0); opacity: 0; }
    12% { transform: translate(-50%, -50%) scale(1.25) rotate(-10deg); opacity: 1; }

<script>
(function () {
  "use strict";

  /* ---------- The secret code (3 digits, one colour each) ---------- */

        '<circle cx="102" cy="26" r="15" fill="#e8913a" stroke="#b8661c" stroke-width="2.5"/>' +
        '<ellipse cx="107" cy="23" rx="2.6" ry="3.6" fill="#1a1a1a"/>' +
        '<path d="M115 28 L119 30 L114 32 Z" fill="#f08aa0"/>' +
        '<path d="M112 32 L120 36 M110 34 L118 41" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>' +
      '</g>' +
    '</svg>' +
    '<svg class="mouse" viewBox="0 0 60 36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
      '<path class="mtail" d="M10 22 C 2 22, 0 10, 6 6" fill="none" stroke="#e8a0b0" stroke-width="2.6" stroke-linecap="round"/>' +
      '<g class="mleg a"><ellipse cx="22" cy="31" rx="4.5" ry="3" fill="#7d8798"/></g>' +
      '<g class="mleg b"><ellipse cx="38" cy="31" rx="4.5" ry="3" fill="#7d8798"/></g>' +
      '<ellipse cx="29" cy="22" rx="20" ry="11" fill="#a9b3c2" stroke="#5c6575" stroke-width="2"/>' +
      '<circle cx="46" cy="14" r="8.5" fill="#a9b3c2" stroke="#5c6575" stroke-width="2"/>' +
      '<circle cx="42" cy="7" r="5" fill="#f6a5b4" stroke="#5c6575" stroke-width="1.8"/>' +
      '<circle cx="48.5" cy="12.5" r="1.8" fill="#111"/>' +
      '<circle cx="54" cy="15" r="1.7" fill="#e87a95"/>' +
      '<path d="M52 16 L58 14 M52 17.5 L58 19" stroke="#5c6575" stroke-width="1" stroke-linecap="round"/>' +
    '</svg></button>';
  document.body.appendChild(runway);
  /* ---------- Hidden test shortcuts: click the running cat 8 times quickly ---------- */
  var testMenu = document.createElement("div");
  testMenu.id = "testmenu";
  testMenu.setAttribute("role", "dialog");
  testMenu.setAttribute("aria-modal", "true");
  testMenu.setAttribute("aria-label", "Testgenv\u00e4gar");
  testMenu.innerHTML = '<div class="tm-card"><h2>Testgenv\u00e4gar</h2><p>Hoppa till valfri slide.</p><div class="tm-list"></div><button type="button" class="btn dark" id="tm-close">St\u00e4ng</button></div>';
  document.body.appendChild(testMenu);
  var tmList = testMenu.querySelector(".tm-list");
  function slideLabel(el) {
    var l = el.getAttribute("data-label");
    if (l) return l;
    var h = el.querySelector("h1, h2");
    var t = h ? h.textContent.trim().replace(/\s+/g, " ") : "Slide";
    return t.length > 38 ? t.slice(0, 36) + "\u2026" : t;
  }
  function buildTestList() {
    tmList.innerHTML = "";
    els.forEach(function (el, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "btn" + (i === current ? " here" : "");
      b.textContent = (i + 1) + ". " + slideLabel(el);
      b.addEventListener("click", function () { testMenu.classList.remove("show"); show(i); });
      tmList.appendChild(b);
    });
  }
  function hideTestMenu() { testMenu.classList.remove("show"); }
  testMenu.querySelector("#tm-close").addEventListener("click", hideTestMenu);
  var tmOpenedAt = 0;
  testMenu.addEventListener("click", function (e) { if (e.target === testMenu && Date.now() - tmOpenedAt > 1500) hideTestMenu(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") hideTestMenu(); });

  var runnerBtn = document.getElementById("runner");

  // Speech-bubble label shown when hovering (or focusing) the running cat
  var runnerTip = document.createElement("div");
  runnerTip.id = "runner-tip";
  runnerTip.textContent = "Starta om från början";
  runnerTip.setAttribute("aria-hidden", "true");
  document.body.appendChild(runnerTip);
  function showRunnerTip() {
    var r = runnerBtn.getBoundingClientRect();
    runnerTip.classList.add("show");
    var w = runnerTip.offsetWidth;
    var x = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2));
    runnerTip.style.left = x + "px";
    runnerTip.style.top = (r.bottom + 6) + "px";
  }
  function hideRunnerTip() { runnerTip.classList.remove("show"); }
  runnerBtn.addEventListener("pointerenter", function (e) { if (e.pointerType !== "touch") showRunnerTip(); });
  runnerBtn.addEventListener("pointerleave", hideRunnerTip);
  runnerBtn.addEventListener("focus", showRunnerTip);
  runnerBtn.addEventListener("blur", hideRunnerTip);
  var runnerClicks = [], heldTimer = null;
  var fleeTimer = null;
  function mouseFlee(m) {
    if (m.classList.contains("fleeing")) return;
    var r = m.getBoundingClientRect();
    m.style.setProperty("--flee", Math.max(200, window.innerWidth - r.left + 80) + "px");
    m.classList.remove("returning");
    m.classList.add("fleeing");
    Sfx.squeak(); Sfx.swipe();
    clearTimeout(fleeTimer);
    fleeTimer = setTimeout(function () {
      m.classList.remove("fleeing");
      m.classList.add("returning");
      setTimeout(function () { m.classList.remove("returning"); }, 700);
    }, 3500);
  }
  runnerBtn.addEventListener("click", function (e) {
    var mouse = e.target.closest ? e.target.closest(".mouse") : null;
    if (mouse) { mouseFlee(mouse); return; }
    var now = Date.now();
    runnerClicks.push(now);
    runnerClicks = runnerClicks.filter(function (t) { return now - t < 5000; });
    // hold the cat still for a moment so it is easier to hit again
    runnerBtn.classList.add("held");
    clearTimeout(heldTimer);
    heldTimer = setTimeout(function () { runnerBtn.classList.remove("held"); }, 2000);
    if (runnerClicks.length >= 8) {
      runnerClicks = [];
      Sfx.win();
      buildTestList();
      tmOpenedAt = Date.now();
      testMenu.classList.add("show");
      var here = tmList.querySelector(".here");
      if (here) here.scrollIntoView({ block: "center" });
      return;
    }
    if (e.target.closest && e.target.closest(".mouse")) Sfx.squeak(); else Sfx.meow();
    popup.classList.remove("show");
    show(0);
  });

  /* ---------- Funny cat popup ---------- */
  var popup = document.getElementById("popup");
  document.getElementById("popup-cat").innerHTML = catSVG({ big: true, funny: true, fur: "#ff9f1c", dark: "#c26d00" });
  function showPopup() { Sfx.meow(); popup.classList.add("show"); document.getElementById("popup-close").focus(); }
  document.getElementById("popup-close").addEventListener("click", function () { popup.classList.remove("show"); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") popup.classList.remove("show"); });

  /* ---------- OSA popup (phone number) ---------- */
  var OSA_NUMBER = "0707654246";
  var osaPopup = document.createElement("div");
  osaPopup.id = "osa-popup";
  osaPopup.setAttribute("role", "dialog");
  osaPopup.setAttribute("aria-modal", "true");
  osaPopup.setAttribute("aria-label", "OSA, telefonnummer");
  osaPopup.innerHTML = '<div class="osa-card">' +
    '<h2>OSA snarast!</h2>' +
    '<p>Svara så snart du kan genom att ringa:</p>' +
    '<a class="osa-num" href="tel:' + OSA_NUMBER + '">' + OSA_NUMBER + '</a>' +
    '<div class="osa-actions">' +
      '<a class="btn" href="tel:' + OSA_NUMBER + '">Ring</a>' +
      '<button type="button" class="btn" id="osa-copy">Kopiera numret</button>' +
      '<button type="button" class="btn dark" id="osa-close">Stäng</button>' +
    '</div>' +
    '<p id="osa-fb" role="status" aria-live="polite"></p>' +
  '</div>';
  document.body.appendChild(osaPopup);
  var osaFb = osaPopup.querySelector("#osa-fb");
  function showOsa() { Sfx.ding(); osaFb.textContent = ""; osaPopup.classList.add("show"); osaPopup.querySelector("#osa-copy").focus(); }
  function hideOsa() { osaPopup.classList.remove("show"); }
  function copyFallback(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    osaFb.textContent = ok ? "Kopierat!" : "Kunde inte kopiera. Tryck och håll på numret.";
  }
  osaPopup.querySelector("#osa-copy").addEventListener("click", function () {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(OSA_NUMBER).then(function () { osaFb.textContent = "Kopierat!"; }, function () { copyFallback(OSA_NUMBER); });
    } else { copyFallback(OSA_NUMBER); }
  });
  osaPopup.querySelector("#osa-close").addEventListener("click", hideOsa);
  osaPopup.addEventListener("click", function (e) { if (e.target === osaPopup) hideOsa(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") hideOsa(); });

  /* ---------- Lightning transition ---------- */
  var fxDark = document.createElement("div"); fxDark.id = "dark";
  var fxCanvas = document.createElement("canvas"); fxCanvas.id = "fx";
  var fxFlash = document.createElement("div"); fxFlash.id = "flash";
  document.body.appendChild(fxDark); document.body.appendChild(fxCanvas); document.body.appendChild(fxFlash);
  var fctx = fxCanvas.getContext("2d");
  var transitioning = false;

  function jag(x1, y1, x2, y2, spread, depth) {
    if (depth === 0) return [[x1, y1], [x2, y2]];
    var mx = (x1 + x2) / 2 + (Math.random() - .5) * spread;
    var my = (y1 + y2) / 2 + (Math.random() - .5) * spread * .4;
    var a = jag(x1, y1, mx, my, spread / 2, depth - 1);
    var b = jag(mx, my, x2, y2, spread / 2, depth - 1);
    return a.concat(b.slice(1));
  }
  function makeBolt(x1, y1, x2, y2, h) {
    var main = jag(x1, y1, x2, y2, Math.max(90, Math.abs(y2 - y1) * .35), 6);
    var branches = [], n = 2 + Math.floor(Math.random() * 3);
    for (var i = 0; i < n; i++) {
      var p = main[Math.floor(main.length * (.2 + Math.random() * .6))];
      var bx = p[0] + (Math.random() - .5) * h * .6, by = p[1] + (.15 + Math.random() * .3) * h * .6;
      branches.push(jag(p[0], p[1], bx, by, 80, 4));
    }
    return { main: main, branches: branches };
  }
  function strokePts(pts, w, color) {
    fctx.beginPath();
    for (var i = 0; i < pts.length; i++) { if (i) fctx.lineTo(pts[i][0], pts[i][1]); else fctx.moveTo(pts[i][0], pts[i][1]); }
    fctx.lineWidth = w; fctx.strokeStyle = color; fctx.stroke();
  }
  function drawBolt(b, a, thick) {
    var paths = [b.main].concat(b.branches);
    for (var i = 0; i < paths.length; i++) {
      var k = (i ? .55 : 1) * thick;
      strokePts(paths[i], 16 * k, "rgba(110,130,255," + (.18 * a) + ")");
      strokePts(paths[i], 8 * k, "rgba(170,190,255," + (.5 * a) + ")");
      strokePts(paths[i], 3 * k, "rgba(255,255,255," + a + ")");
    }
  }

  function lightningTransition(onPeak, target) {
    if (transitioning) return;
    transitioning = true;
    var dpr2 = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth, h = window.innerHeight;
    fxCanvas.width = w * dpr2; fxCanvas.height = h * dpr2;
    fctx.setTransform(dpr2, 0, 0, dpr2, 0, 0);
    fctx.lineCap = "round"; fctx.lineJoin = "round";
    fxCanvas.classList.add("on");

    function finish() {
      fctx.clearRect(0, 0, w, h);
      fxCanvas.classList.remove("on");
      fxFlash.style.opacity = 0;
      fxDark.style.opacity = 0;
      stage.classList.remove("quake");
      transitioning = false;
    }

    if (reduce) {
      fxFlash.style.transition = "opacity .3s ease";
      fxFlash.style.opacity = .85;
      setTimeout(function () {
        onPeak();
        fxFlash.style.opacity = 0;
        setTimeout(function () { fxFlash.style.transition = ""; finish(); }, 500);
      }, 350);
      return;
    }

    fxDark.style.opacity = ".78";
    stage.classList.add("quake");
    Sfx.rumble(2.1); Sfx.duck(4.2);
    var start = performance.now();
    var strikes = [150, 480, 760, 1000, 1200, 1380, 1560, 1730, 1870];
    var si = 0, bolts = [], flashLvl = 0, peaked = false;

    function tick(now) {
      var t = now - start;
      while (si < strikes.length && t >= strikes[si]) {
        var big = si >= 5, count = si === 0 ? 1 : (big ? 3 : 1 + (si % 2));
        for (var c = 0; c < count; c++) {
          var x1 = w * (.08 + Math.random() * .84), y1 = -10, x2, y2;
          if (c === 0 && target && (si === 0 || si === 4 || si === 8)) { x2 = target.x; y2 = target.y; x1 = target.x + (Math.random() - .5) * w * .5; }
          else { x2 = x1 + (Math.random() - .5) * w * .5; y2 = h * (.45 + Math.random() * .5); }
          var b = makeBolt(x1, y1, x2, y2, h);
          b.born = now; b.life = 280 + Math.random() * 220; b.thick = big ? 1.5 : 1;
          bolts.push(b);
        }
        flashLvl = .45 + Math.random() * .5;
        Sfx.crack(big);
        si++;
      }
      fctx.clearRect(0, 0, w, h);
      bolts = bolts.filter(function (b) { return now - b.born < b.life; });
      for (var i = 0; i < bolts.length; i++) {
        var age = (now - bolts[i].born) / bolts[i].life;
        drawBolt(bolts[i], (1 - age) * (Math.random() > .25 ? 1 : .45), bolts[i].thick);
      }
      if (t < 2000) {
        flashLvl *= .86;
      } else {
        if (!peaked) { peaked = true; Sfx.boom(); fxDark.style.opacity = 0; stage.classList.remove("quake"); onPeak(); }
        flashLvl = t < 2300 ? 1 : Math.max(0, 1 - (t - 2300) / 800);
      }
      fxFlash.style.opacity = flashLvl.toFixed(3);
      if (t < 3200) requestAnimationFrame(tick); else finish();
    }
    requestAnimationFrame(tick);
  }

  /* ---------- Snow ---------- */
  var canvas = document.getElementById("snow");
  var ctx = canvas.getContext("2d");
  var flakes = [];
  var W = 0, H = 0, dpr = 1;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var target = Math.round(Math.min(220, Math.max(60, W * H / 7000)));
    if (reduce) target = Math.round(target / 3);
    while (flakes.length < target) flakes.push(makeFlake(true));
    flakes.length = target;
  }
  function makeFlake(anywhere) {
    return {
      x: Math.random() * W,
      y: anywhere ? Math.random() * H : -10,
      r: 1 + Math.random() * 3.2,
      v: .5 + Math.random() * 1.4,
      drift: Math.random() * Math.PI * 2,
      sway: .3 + Math.random() * .8
    };
  }
  var dflakes = [];
  function newDigit(kind, y) {
    var real = kind >= 0;
    return {
      kind: kind,
      ch: String(real ? CODE[kind] : Math.floor(Math.random() * 10)),
      x: 30 + Math.random() * Math.max(10, W - 60),
      y: y,
      v: .8 + Math.random() * .5,
      drift: Math.random() * 6.28,
      sway: .25 + Math.random() * .4,
      size: 26 + Math.random() * 10,
      rot: Math.random() * .5 - .25
    };
  }
  function drawDigits() {
    if (!digitMode) { if (dflakes.length) dflakes.length = 0; return; }
    var k, i;
    if (!dflakes.length) {
      for (k = 0; k < 3; k++) {
        dflakes.push(newDigit(k, Math.random() * H * .6));
        dflakes.push(newDigit(k, -Math.random() * H * .9 - 30));
      }
      for (k = 0; k < 6; k++) dflakes.push(newDigit(-1, Math.random() * H));
    }
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (i = 0; i < dflakes.length; i++) {
      var f = dflakes[i];
      f.drift += .012;
      f.y += f.v * (reduce ? .4 : 1);
      f.x += Math.sin(f.drift) * f.sway;
      if (f.y > H + 40) { dflakes[i] = newDigit(f.kind, -30); continue; }
      var real = f.kind >= 0;
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.rot + Math.sin(f.drift) * .15);
      ctx.globalAlpha = real ? 1 : .55;
      ctx.font = "700 " + f.size + "px Georgia, serif";
      ctx.fillStyle = real ? CODE_COLORS[f.kind] : "#ffffff";
      if (real) { ctx.shadowColor = CODE_COLORS[f.kind]; ctx.shadowBlur = 10; }
      ctx.fillText(f.ch, 0, 0);
      ctx.restore();
    }
  }
  function frame() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = sandMode ? "rgba(255,206,130,.85)" : "rgba(255,255,255,.88)";
    for (var i = 0; i < flakes.length; i++) {
      var f = flakes[i];
      f.drift += .01;
      f.y += f.v * (reduce ? .4 : 1);
      f.x += Math.sin(f.drift) * f.sway;
      if (f.y > H + 10) { flakes[i] = makeFlake(false); flakes[i].x = Math.random() * W; continue; }
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fill();
    }
    drawDigits();
    requestAnimationFrame(frame);
  }
  window.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
